<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shubham & Vandana - Wedding Invitation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            font-family: 'Playfair Display', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .invite-wrapper {
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
        }

        .invite-image {
            width: 100%;
            display: block;
        }

        .timer-section {
            background: linear-gradient(135deg, #b0edd3 0%, #e2eed1 100%);
            padding: 25px 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            border-top: 2px solid #fff;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            padding: 15px 10px;
            min-width: 75px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            color: #2c3e50;
        }

        .time-box span.number {
            display: block;
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .time-box span.label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #555;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .timer-section {
                gap: 10px;
                padding: 15px 10px;
            }
            .time-box {
                min-width: 60px;
                padding: 10px 5px;
            }
            .time-box span.number {
                font-size: 24px;
            }
            .time-box span.label {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>

<div class="invite-wrapper">
    <!-- Image Display -->
    <img src="Gemini_Generated_Image_bjopyabjopyabjop.png" alt="Shubham Weds Vandana" class="invite-image">
    
    <!-- Live Countdown Timer -->
    <div class="timer-section" id="countdown">
        <div class="time-box">
            <span class="number" id="days">00</span>
            <span class="label">Days</span>
        </div>
        <div class="time-box">
            <span class="number" id="hours">00</span>
            <span class="label">Hours</span>
        </div>
        <div class="time-box">
            <span class="number" id="minutes">00</span>
            <span class="label">Minutes</span>
        </div>
        <div class="time-box">
            <span class="number" id="seconds">00</span>
            <span class="label">Seconds</span>
        </div>
    </div>
</div>

<script>
    // Set the target date: November 30, 2026 at Midnight
    const countDownDate = new Date("Nov 30, 2026 00:00:00").getTime();

    // Update the countdown every 1 second
    const timerInterval = setInterval(function() {

        // Get today's date and time
        const now = new Date().getTime();
        
        // Find the distance between now and the target date
        const distance = countDownDate - now;
        
        // Time calculations for days, hours, minutes and seconds
        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);
        
        // Output the result in the corresponding elements, padding with zeroes if needed
        document.getElementById("days").innerText = days.toString().padStart(2, '0');
        document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
        document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
        document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
        
        // If the countdown is finished, display a message
        if (distance < 0) {
            clearInterval(timerInterval);
            document.getElementById("countdown").innerHTML = "<h2 style='color: #2c3e50; margin:0; padding: 20px; font-family: Playfair Display, serif;'>The big day is here!</h2>";
        }
    }, 1000);
</script>

</body>
</html>
